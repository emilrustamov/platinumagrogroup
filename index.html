<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fondamento:ital@0;1&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@100..900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
    <link rel="icon" href="/favicon.ico">
    <!-- <link rel="icon" href="/favicon.ico" sizes="any"> -->
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Platinum AgroGroup</title>
    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #FFF8EF; /* поправь под фон сайта */
        animation: splashFadeIn 0.4s ease-out;
      }

      @keyframes splashFadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      /* ---- Лепестковый спиннер: 8 заострённых листьев по кругу, один цвет
           (оранжевый), каждый гаснет/загорается по очереди — создаёт эффект
           "бегущей волны" вращения без физического вращения формы ---- */
      .splash-leaf-spinner {
        position: relative;
        width: 80px;
        height: 80px;
      }

      .splash-leaf {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 16px;
        height: 30px;
        margin: -30px 0 0 -8px;
        transform-origin: 8px 30px; /* ось вращения — нижний кончик листа, у самого центра */
        opacity: 0.2;
        animation: splashLeafFade 1.6s linear infinite;
      }

      .splash-leaf svg {
        width: 100%;
        height: 100%;
        display: block;
      }

      /* Каждый лист повёрнут на 45° больше предыдущего (360°/8), у всех один цвет,
         разница только в задержке анимации — из-за неё и возникает "бег по кругу" */
      .splash-leaf--1 { transform: rotate(0deg);   animation-delay: 0s; }
      .splash-leaf--2 { transform: rotate(45deg);  animation-delay: 0.2s; }
      .splash-leaf--3 { transform: rotate(90deg);  animation-delay: 0.4s; }
      .splash-leaf--4 { transform: rotate(135deg); animation-delay: 0.6s; }
      .splash-leaf--5 { transform: rotate(180deg); animation-delay: 0.8s; }
      .splash-leaf--6 { transform: rotate(225deg); animation-delay: 1.0s; }
      .splash-leaf--7 { transform: rotate(270deg); animation-delay: 1.2s; }
      .splash-leaf--8 { transform: rotate(315deg); animation-delay: 1.4s; }

      @keyframes splashLeafFade {
        0% { opacity: 1; }
        100% { opacity: 0.2; }
      }

      @media (prefers-reduced-motion: reduce) {
        #app-splash *,
        #app-splash {
          animation: none !important;
        }
        .splash-leaf {
          opacity: 0.6 !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="app-splash">
        <div class="splash-leaf-spinner">
          <div class="splash-leaf splash-leaf--1">
            <svg viewBox="0 0 16 30" fill="none"><path d="M8 0C13 8 13 22 8 30C3 22 3 8 8 0Z" fill="#F4A11E"/></svg>
          </div>
          <div class="splash-leaf splash-leaf--2">
            <svg viewBox="0 0 16 30" fill="none"><path d="M8 0C13 8 13 22 8 30C3 22 3 8 8 0Z" fill="#F4A11E"/></svg>
          </div>
          <div class="splash-leaf splash-leaf--3">
            <svg viewBox="0 0 16 30" fill="none"><path d="M8 0C13 8 13 22 8 30C3 22 3 8 8 0Z" fill="#F4A11E"/></svg>
          </div>
          <div class="splash-leaf splash-leaf--4">
            <svg viewBox="0 0 16 30" fill="none"><path d="M8 0C13 8 13 22 8 30C3 22 3 8 8 0Z" fill="#F4A11E"/></svg>
          </div>
          <div class="splash-leaf splash-leaf--5">
            <svg viewBox="0 0 16 30" fill="none"><path d="M8 0C13 8 13 22 8 30C3 22 3 8 8 0Z" fill="#F4A11E"/></svg>
          </div>
          <div class="splash-leaf splash-leaf--6">
            <svg viewBox="0 0 16 30" fill="none"><path d="M8 0C13 8 13 22 8 30C3 22 3 8 8 0Z" fill="#F4A11E"/></svg>
          </div>
          <div class="splash-leaf splash-leaf--7">
            <svg viewBox="0 0 16 30" fill="none"><path d="M8 0C13 8 13 22 8 30C3 22 3 8 8 0Z" fill="#F4A11E"/></svg>
          </div>
          <div class="splash-leaf splash-leaf--8">
            <svg viewBox="0 0 16 30" fill="none"><path d="M8 0C13 8 13 22 8 30C3 22 3 8 8 0Z" fill="#F4A11E"/></svg>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
